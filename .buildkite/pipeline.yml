agents:
  queue: "hosted"

steps:
  - label: ":mag: Check benchmark harness"
    key: "benchmark-checks"
    command: "scripts/check"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"

  - label: ":floppy_disk: Write cache-volume probe"
    key: "cache-volume-probe-write"
    if: build.env("BENCHMARK") == "cache-volume-probe"
    agents:
      queue: "hosted-m"
    command: |
      set -euo pipefail
      probe=/tmp/buildkite-cache-volume-probe
      findmnt -T "$$probe"
      df -h "$$probe"
      du -sh "$$probe"
      printf '%s\n' 'buildkite-cache-volume-probe-20260826-v2' > "$$probe/marker"
      dd if=/dev/zero of="$$probe/payload" bs=1M count=64 conv=fsync status=none
      sync
      sha256sum "$$probe/marker" "$$probe/payload"
      du -sh "$$probe"
      df -h "$$probe"
    cache:
      paths:
        - /tmp/buildkite-cache-volume-probe
      name: buildkite-cache-volume-probe-20260826-v2
      size: 20g

  - label: ":mag: Read cache-volume probe"
    key: "cache-volume-probe-read"
    if: build.env("BENCHMARK") == "cache-volume-probe"
    depends_on: "cache-volume-probe-write"
    agents:
      queue: "hosted-m"
    command: |
      set -euo pipefail
      probe=/tmp/buildkite-cache-volume-probe
      findmnt -T "$$probe"
      df -h "$$probe"
      du -sh "$$probe"
      test "$$(cat "$$probe/marker")" = 'buildkite-cache-volume-probe-20260826-v2'
      test "$$(stat -c '%s' "$$probe/payload")" = 67108864
      sha256sum "$$probe/marker" "$$probe/payload"
    cache:
      paths:
        - /tmp/buildkite-cache-volume-probe
      name: buildkite-cache-volume-probe-20260826-v2
      size: 20g

  - label: ":github: Kafka via buildkite-gha"
    key: "kafka-buildkite-gha"
    if: build.env("BENCHMARK") == "kafka"
    timeout_in_minutes: 20
    retry:
      automatic: false
    cache: "/cache/bkcache/github-actions-buildkite-plugin"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          dir: ".buildkite/mise-go"
      - github-actions#v0.9.3:
          workflow: .github/workflows/kafka.yml
          version: "0.37.0"
          runners:
            - runs-on: ubuntu-24.04
              queue: hosted-m
              cache:
                paths:
                  - /home/runner/.gradle/caches
                  - /home/runner/.gradle/wrapper
                name: kafka-gradle-volume-20260825-v2
                size: 20g

  - label: ":github: gRPC via buildkite-gha"
    key: "grpc-buildkite-gha"
    if: build.env("BENCHMARK") == "grpc"
    timeout_in_minutes: 20
    retry:
      automatic: false
    cache: "/cache/bkcache/github-actions-buildkite-plugin"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          dir: ".buildkite/mise-go"
      - github-actions#v0.9.3:
          workflow: .github/workflows/grpc.yml
          version: "0.29.0"
          runners:
            - runs-on: ubuntu-24.04
              queue: hosted-m

  - label: ":github: Mastodon via buildkite-gha"
    key: "mastodon-buildkite-gha"
    if: build.env("BENCHMARK") == "mastodon"
    timeout_in_minutes: 20
    retry:
      automatic: false
    cache: "/cache/bkcache/github-actions-buildkite-plugin"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          dir: ".buildkite/mise-go"
      - github-actions#v0.9.3:
          workflow: .github/workflows/mastodon.yml
          version: "0.29.0"
          runners:
            - runs-on: ubuntu-24.04
              queue: hosted-m

  - label: ":github: PostHog via buildkite-gha"
    key: "posthog-buildkite-gha"
    if: build.env("BENCHMARK") == "posthog"
    timeout_in_minutes: 20
    retry:
      automatic: false
    cache: "/cache/bkcache/github-actions-buildkite-plugin"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          dir: ".buildkite/mise-go"
      - github-actions#v0.9.3:
          workflow: .github/workflows/posthog.yml
          version: "0.29.0"
          runners:
            - runs-on: ubuntu-24.04
              queue: hosted-m
