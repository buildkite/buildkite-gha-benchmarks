name: PostHog

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildkite:
    name: Buildkite cached
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch PostHog source
        id: upstream
        run: |
          scripts/fetch-source posthog upstream
          echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build PostHog
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: upstream
          platforms: linux/amd64,linux/arm64
          build-args: BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
          cache-from: type=gha,scope=posthog-${{ steps.upstream.outputs.sha }}
          cache-to: type=gha,mode=max,scope=posthog-${{ steps.upstream.outputs.sha }}
