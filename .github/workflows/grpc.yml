name: gRPC

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Cached build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up C++ toolchain
        run: |
          if ! command -v gcc >/dev/null || ! command -v g++ >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes build-essential
          fi
          echo "CC=$(command -v gcc)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v g++)" >> "$GITHUB_ENV"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          cache-version: grpc-cross-provider-20260822-v2
          bazelisk-cache: true
          disk-cache: grpc-cross-provider-20260822-v2
          repository-cache: true
          token: ""

      - name: Run gRPC canary
        run: scripts/run-workload grpc

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grpc-result
          path: benchmark-result.json
          if-no-files-found: warn
