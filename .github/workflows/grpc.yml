name: gRPC

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Cached build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@f3f50ea6791b9b0f4c4eeabba4507422426462f5 # v0.9.1
        with:
          cache-version: grpc-cross-provider-20260822
          bazelisk-cache: true
          disk-cache: grpc-cross-provider-20260822
          repository-cache: true
          token: ""

      - name: Run gRPC canary
        run: scripts/run-workload grpc

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grpc-result
          path: benchmark-result.json
          if-no-files-found: warn
