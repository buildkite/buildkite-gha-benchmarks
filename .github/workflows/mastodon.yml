name: Mastodon

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Cached build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch Mastodon source
        run: scripts/fetch-source mastodon upstream

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Mastodon
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: upstream
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=mastodon-cross-provider-20260822
          cache-to: type=gha,mode=max,scope=mastodon-cross-provider-20260822
